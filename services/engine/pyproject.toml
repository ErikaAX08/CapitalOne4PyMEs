[project]
name = "fragility-engine"
version = "1.0.0"
description = "Deterministic cash calendar, Monte Carlo simulation and tension sweep for the SME structural fragility engine."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402"]
"scripts/*" = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
